<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Five Nights at Corgi's</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.game-container {
    background: black;
    width: 960px;
    height: 720px;
    position: relative;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

.credit {
    position: fixed;
    bottom: 10px;
    left: 12px;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 0.3px;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="game-container">
    <iframe
        src="https://turbowarp.org/667188466/embed?autoplay&addons=remove-curved-stage-border&fullscreen-background=%23000000"
        allowfullscreen>
    </iframe>
</div>

<div class="credit">
    Benjamin Raisanen - Five Nights at Corgi's (2022)
</div>

</body>
</html>
