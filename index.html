<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Scratch Game</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game-container{
    background:#1b1b1b;
    padding:18px;
    border:2px solid #2f2f2f;
    box-shadow:0 0 25px rgba(0,0,0,.5);
}

iframe{
    width:960px;
    height:720px;
    border:none;
    display:block;
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:16px;
}

button{
    width:120px;
    padding:12px 0;
    border:none;
    border-radius:0;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:background .2s;
    color:white;
}

.play{
    background:#1ea34a;
}

.play:hover{
    background:#2bc35c;
}

.stop{
    background:#c0392b;
}

.stop:hover{
    background:#d84a3a;
}
</style>
</head>

<body>

<div class="game-container">

<iframe
    id="game"
    src="https://turbowarp.org/667188466/embed?autoplay&addons=remove-curved-stage-border,pause"
    allowfullscreen>
</iframe>

<div class="controls">
    <button class="play" onclick="restartGame()">PLAY</button>
    <button class="stop" onclick="stopGame()">STOP</button>
</div>

</div>

<script>
const url = "https://turbowarp.org/667188466/embed?autoplay&addons=remove-curved-stage-border,pause";
const game = document.getElementById("game");

function restartGame(){
    game.src = url;
}

function stopGame(){
    game.src = "about:blank";
}
</script>

</body>
</html>
